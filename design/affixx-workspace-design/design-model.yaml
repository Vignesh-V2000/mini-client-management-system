name: Affixx Workspace
brand_domain: Client management
brand_type: ui-rich
primary_mode: light
philosophy: A paper ledger inside a charcoal workspace. Warm surfaces and a single brick accent support fast, accurate work with client records.
mono_for_code: true
mono_for_metrics: false
tokens:
  colors:
    light:
      background: '#f7f6f2'
      surface1: '#ffffff'
      surface2: '#f0efea'
      surface3: '#fcfbf8'
      border: '#e6e3dc'
      border_visible: '#c9c5bb'
      text1: '#222521'
      text2: '#565c55'
      text3: '#686d65'
      accent: '#a63829'
      accent_hover: '#872c20'
      accent_subtle: '#faece8'
    dark:
      background: '#202420'
      surface1: '#2b302b'
      border: '#41483f'
      text1: '#f8f7f2'
      text2: '#b9c0b5'
      accent: '#ffa18b'
    success: '#206046'
    success_bg: '#e9f4ed'
    warning: '#805612'
    warning_bg: '#fbf1da'
    error: '#9d3027'
    error_bg: '#fbedeb'
  typography:
    display: { family: 'Manrope Variable', size: 56, weight: 750, line_height: 1.05 }
    heading: { family: 'Manrope Variable', size: 40, weight: 800, line_height: 1.1 }
    subheading: { family: 'Manrope Variable', size: 20, weight: 800, line_height: 1.3 }
    body: { family: 'DM Sans Variable', size: 15, weight: 400, line_height: 1.5 }
    body-sm: { family: 'DM Sans Variable', size: 14, weight: 500, line_height: 1.5 }
    caption: { family: 'DM Sans Variable', size: 13, weight: 400, line_height: 1.5 }
    label: { family: 'DM Sans Variable', size: 11, weight: 700, line_height: 1.5 }
    mono: { family: 'ui-monospace' }
  spacing: [2, 4, 8, 16, 24, 32, 48, 64, 96]
  radii: { control: 8, panel: 16, badge: 999 }
  motion: { duration_ms: 150, easing: ease-out }
  elevation: Flat panels with borders. Reserve shadow for modal separation.
iconography:
  observed_style: The original interface uses text navigation and actions.
  fallback_kit: Lucide
  match_reasoning: Rounded outline geometry and low detail keep navigation legible. The consistent stroke also suits small table controls.
hero_stage:
  preset: grid-on-dark
  observed_style: The original sign-in page has a plain background. The redesign uses a static charcoal grid and intersecting circles as a decorative route diagram.
  background: { medium: pattern, motion: static, intensity: subtle }
  hero: { subject: composition, form: intersecting circles, placement: right }
  relation: { type: flat, bleed: 0 }
app_screen: { archetype: dashboard, device: browser }
components:
  navigation: { source: observed, design: Charcoal rail with two links and a mobile navigation row. }
  records: { source: observed, design: Desktop table with mobile record cards and explicit status labels. }
  inputs: { source: observed, design: Labels above fields with errors beside the affected control. }
  overlays: { source: derived, design: Native confirmation dialog with explicit cancel and delete actions. }
